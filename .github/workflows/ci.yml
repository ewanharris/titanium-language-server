name: CI
on:
  - pull_request
  - push

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v3
        with:
          node-version: '16.x'
      - name: Install NPM dependencies
        run: npm ci
      - name: Type Check
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test

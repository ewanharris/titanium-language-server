name: CI
on:
  - pull_request
  - push

jobs:
  lint-build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run build
      - name: Lint
        run: npm run lint

  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    needs: lint-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        node: [ '22.x', '24.x' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # the suite runs the sources through Node's type stripping, so there is no build step here.
      # node --test is given coverage thresholds, so this fails below the coverage floor
      - name: Test
        run: npm test

  node20:
    name: Node 20 compatibility
    needs: lint-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # the engines floor, since that is the oldest Node the package promises to run on
          node-version: '20.18'
          cache: npm
      - run: npm ci
      - run: npm run build
      # the suite runs the sources through type stripping, which Node 20 does not have, so this
      # starts the built server and asks it one question. tsc checks the API surface against Node
      # 20's types; this checks that what it emitted loads and answers on Node 20 itself
      - name: Answer initialize
        run: |
          node --input-type=module <<'EOF'
          import { spawn } from 'node:child_process';
          const server = spawn(process.execPath, [ 'out/server.js', '--stdio' ], { stdio: [ 'pipe', 'pipe', 'inherit' ] });
          const fail = message => { console.error(message); process.exit(1); };
          setTimeout(() => fail('no answer to initialize'), 20000);
          server.on('exit', code => fail(`the server exited with ${code} before answering`));
          const body = JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'initialize', params: { processId: null, rootUri: null, capabilities: {} } });
          server.stdin.write(`Content-Length: ${Buffer.byteLength(body)}\r\n\r\n${body}`);
          let output = '';
          server.stdout.on('data', chunk => {
            output += chunk;
            if (output.includes('"id":1,"result":{"capabilities"')) {
              console.log(`answered initialize on Node ${process.version}`);
              process.exit(0);
            }
          });
          EOF

  e2e:
    name: End to end / ${{ matrix.os }}
    needs: lint-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      # the one tier allowed to reach the npm registry: a spawned server fetches @types/titanium for
      # real, into a temporary cache, then answers from that cache offline. Its own job so that a
      # registry outage fails this alone rather than the whole matrix, and on every OS because
      # running npm is not the same act on each: on Windows it is a batch file, which Node would
      # not start, and nothing else in the suite runs npm for real to notice
      - name: Test end to end
        run: npm run test:e2e

name: CI
on:
  - pull_request
  - push

jobs:
  Lint-Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v3
        with:
          node-version: '16.x'
      - name: Install NPM dependencies
        run: npm ci
      - name: Type Check
        run: npm run build
      - name: Lint
        run: npm run lint

  Test:
    name: ${{ matrix.os }} - Unit Tests
    needs: Lint-Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '16.x'
      - name: Install NPM dependencies
        run: npm ci
      - run: npm run build
      - name: Run Tests
        run: npm run test

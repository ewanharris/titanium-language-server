name: CI
on:
  - pull_request
  - push

jobs:
  lint-build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run build
      - name: Lint
        run: npm run lint

  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    needs: lint-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        node: [ '20.x', '22.x', '24.x' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # c8 is configured with check-coverage, so this fails below the coverage floor
      - name: Test
        run: npm test

name: CI
on:
  - pull_request
  - push

jobs:
  lint-build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run build
      - name: Lint
        run: npm run lint

  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    needs: lint-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        node: [ '22.x', '24.x' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # the suite runs the sources through Node's type stripping, so there is no build step here.
      # node --test is given coverage thresholds, so this fails below the coverage floor
      - name: Test
        run: npm test

  package:
    name: Built package
    needs: lint-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      # the one tier that runs against out/ rather than the sources: the bin's shebang, the
      # exports map, and the command as npm links it
      - name: Test the built package
        run: npm run test:package

  e2e:
    name: End to end / ${{ matrix.os }}
    needs: lint-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      # the one tier allowed to reach the npm registry: a spawned server fetches @types/titanium for
      # real, into a temporary cache, then answers from that cache offline. Its own job so that a
      # registry outage fails this alone rather than the whole matrix, and on every OS because
      # running npm is not the same act on each: on Windows it is a batch file, which Node would
      # not start, and nothing else in the suite runs npm for real to notice
      - name: Test end to end
        run: npm run test:e2e
